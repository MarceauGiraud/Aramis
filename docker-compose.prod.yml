services:
  redis:
    image: redis:7-alpine
    container_name: aramis-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot-worker:
    build:
      context: .
      dockerfile: apps/bot-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      - REDIS_URL=redis://redis:6379
      - BOT_CONCURRENCY=2
      - NODE_ENV=production
      - BOT_HEADLESS=false
      - BOT_DEBUG=false
    shm_size: '2gb'
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
    ports:
      - "8765:8765"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  redis-data:
