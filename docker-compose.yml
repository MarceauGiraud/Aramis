version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aramis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aramis
      POSTGRES_PASSWORD: aramis
      POSTGRES_DB: aramis
    volumes:
      - .docker-data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aramis"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for job queue
  redis:
    image: redis:7-alpine
    container_name: aramis-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - .docker-data/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO for S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: aramis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - .docker-data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Web application (Next.js)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: aramis-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://aramis:aramis@postgres:5432/aramis?schema=public
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
    ports:
      - "3000:3000"
    profiles:
      - production

  # Bot Worker (Playwright-based)
  bot-worker:
    build:
      context: .
      dockerfile: apps/bot-worker/Dockerfile
    container_name: aramis-bot-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override REDIS_URL from .env: localhost doesn't work inside Docker
      - REDIS_URL=redis://host.docker.internal:6379
      - BOT_CONCURRENCY=2
      # DISPLAY and PULSE_SOURCE are managed per-bot by DisplayAllocator
    # Shared memory for Chrome + Xvfb
    shm_size: '2gb'
    ports:
      - "8765:8765"  # Health + Prometheus metrics + WebSocket
    # Uncomment for NVIDIA GPU acceleration (NVENC encoding):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, video]
